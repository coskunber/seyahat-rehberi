<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yurt Dışı Seyahat Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sol Menü / Form Alanı -->
        <aside class="sidebar">
            <div class="logo">
                <h2>🌍 TripDash</h2>
                <p>Akıllı Seyahat Paneli</p>
            </div>
            
            <div class="form-group">
                <label>Nereye Gidiyorsun?</label>
                <select id="citySelect">
                    <option value="uskup">🇲🇰 Üsküp, Kuzey Makedonya</option>
                    <option value="roma">🇮🇹 Roma, İtalya</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group half">
                    <label>Kaç Gün?</label>
                    <input type="number" id="days" value="4" min="1">
                </div>
                <div class="form-group half">
                    <label>Yetişkin</label>
                    <input type="number" id="adults" value="2" min="1">
                </div>
            </div>

            <div class="form-group">
                <label>Bütçe Profili</label>
                <select id="budgetSelect">
                    <option value="ekonomik">🎒 Sırt Çantalı (Ekonomik)</option>
                    <option value="orta" selected>🏨 Orta Segment (Rahat)</option>
                    <option value="konforlu">🥂 Konforlu & Lüks</option>
                </select>
            </div>

            <button onclick="generateGuide()" class="btn-primary">Rehberi Oluştur 🚀</button>
        </aside>

        <!-- Sağ Taraf / Sonuç Dashboard Alanı -->
        <main class="content-area">
            <div id="welcomeState" class="welcome-state">
                <h1>Gitmeden önce bilmen gereken her şey.</h1>
                <p>Seyahatini planlamak için soldaki paneli kullan.</p>
            </div>
            
            <div id="resultArea" class="dashboard-grid hidden">
                <!-- JS içeriği buraya basılacak -->
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
